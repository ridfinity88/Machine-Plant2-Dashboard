<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1c">
  <title>HAO2C Line Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080f1c;
      --surface: #101b2b;
      --surface-2: #142238;
      --surface-3: #1a2b43;
      --line: rgba(148, 171, 202, .16);
      --text: #edf4ff;
      --muted: #91a4bd;
      --accent: #39b7ff;
      --accent-2: #167bd1;
      --featured-accent: #f59e0b;
      --glow: rgba(38, 166, 255, .18);
      --shadow: 0 4px 14px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { height: 100%; background: var(--bg); }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0 16px 12px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% -10%, rgba(24, 112, 180, .19), transparent 38%),
        radial-gradient(ellipse at 90% 0%, rgba(20, 74, 132, .13), transparent 32%),
        var(--bg);
      font-family: Inter, "Segoe UI", Tahoma, Arial, "Noto Sans Thai", sans-serif;
    }

    .topbar {
      width: 100%;
      max-width: 1840px;
      height: 54px;
      flex: 0 0 54px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .brand-wrap { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 34px; height: 34px; flex: 0 0 34px;
      display: grid; place-items: center;
      border: 1px solid rgba(57, 183, 255, .35);
      border-radius: 10px;
      color: var(--accent);
      background: linear-gradient(145deg, rgba(57,183,255,.18), rgba(22,123,209,.07));
      box-shadow: 0 0 18px var(--glow);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand {
      min-width: 0;
      font-size: clamp(16px, 1.6vw, 21px);
      font-weight: 750;
      letter-spacing: .2px;
      line-height: 1.15;
    }
    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .home-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 34px; padding: 0 13px;
      color: #eaf7ff; text-decoration: none; white-space: nowrap;
      border: 1px solid rgba(57,183,255,.35);
      border-radius: 9px;
      background: linear-gradient(135deg, #147fc5, #105b9b);
      box-shadow: 0 4px 14px rgba(0, 111, 190, .2);
      font-size: 12px; font-weight: 700;
      transition: .2s ease;
    }
    .home-btn:hover { filter: brightness(1.13); transform: translateY(-1px); }
    .home-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .page-tabs {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px; border: 1px solid var(--line);
      border-radius: 9px; background: rgba(16, 27, 43, .9);
    }
    .tab {
      min-width: 72px; height: 28px; padding: 0 12px;
      border: 0; border-radius: 6px;
      color: var(--muted); background: transparent;
      font: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: .2s ease;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, #168bd2, #1263a7);
      box-shadow: 0 2px 8px rgba(0, 124, 210, .22);
    }

    main {
      width: 100%;
      max-width: 1840px;
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #page1 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: 1.25fr 10fr;
      gap: 8px;
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      min-height: 0;
    }

    /* 11 คอลัมน์ต่อแถว: คอลัมน์แรกคือ Power Meter1..10 และ 10 คอลัมน์ถัดไปคือกล่องข้อมูล */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.15fr repeat(10, minmax(0, 1fr));
      grid-template-rows: repeat(10, minmax(0, 1fr));
      gap: 6px;
      min-height: 0;
    }

    .tile {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: linear-gradient(150deg, rgba(23, 39, 60, .98), rgba(14, 25, 41, .98));
      box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile::before {
      content: ""; position: absolute; top: 0; left: 10px; right: 10px;
      height: 1.5px; border-radius: 0 0 3px 3px;
      background: linear-gradient(90deg, transparent, rgba(57,183,255,.8), transparent);
      opacity: .65;
    }
    .tile:hover {
      transform: translateY(-1px);
      border-color: rgba(57,183,255,.45);
      z-index: 2;
    }

    /* กล่องด้านซ้ายของแถวที่ 2-11 (Power Meter1 - Power Meter10): สีเด่นชัดและข้อความอยู่ตรงกลาง */
    .tile.meter-label {
      justify-content: center;
      align-items: center;
      padding: 4px 6px;
      border: 1.5px solid rgba(251, 191, 36, 0.85);
      background: linear-gradient(145deg, rgba(120, 53, 15, .96), rgba(69, 26, 3, .98));
      box-shadow: 0 4px 16px rgba(0, 0, 0, .32), inset 0 0 14px rgba(251, 191, 36, .18);
    }
    .tile.meter-label::before {
      height: 2px;
      opacity: 1;
      background: linear-gradient(90deg, transparent, #fde047, transparent);
    }
    .tile.meter-label:hover {
      border-color: #fde047;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .38), 0 0 14px rgba(251, 191, 36, .35);
    }
    .meter-label-text {
      width: 100%;
      text-align: center;
      color: #fef08a;
      font-size: clamp(10.5px, 0.92vw, 14px);
      font-weight: 800;
      letter-spacing: .25px;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* สีกลุ่มที่ 2 (กล่องที่ 4, 5, 6 ของแถวที่ 2-11): เขียวมรกต */
    .tile.col-group-456 {
      border-color: rgba(16, 185, 129, 0.52);
      background: linear-gradient(150deg, rgba(16, 48, 44, .98), rgba(11, 29, 36, .98));
    }
    .tile.col-group-456::before {
      background: linear-gradient(90deg, transparent, rgba(16, 185, 129, .85), transparent);
      opacity: .8;
    }
    .tile.col-group-456:hover {
      border-color: rgba(52, 211, 153, .85);
    }
    .tile.col-group-456 .tile-meta {
      color: #6ee7b7;
    }

    /* สีกลุ่มที่ 3 (กล่องที่ 7, 8, 9 ของแถวที่ 2-11): ม่วง */
    .tile.col-group-789 {
      border-color: rgba(168, 85, 247, 0.52);
      background: linear-gradient(150deg, rgba(37, 23, 56, .98), rgba(17, 21, 43, .98));
    }
    .tile.col-group-789::before {
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, .85), transparent);
      opacity: .8;
    }
    .tile.col-group-789:hover {
      border-color: rgba(192, 132, 252, .85);
    }
    .tile.col-group-789 .tile-meta {
      color: #d8b4fe;
    }

    /* สีกลุ่มที่ 4 (กล่องที่ 10 ของแถวที่ 2-11): ฟ้าเทอร์ควอยซ์ / Cyan */
    .tile.col-group-10 {
      border-color: rgba(6, 182, 212, 0.62);
      background: linear-gradient(150deg, rgba(13, 49, 64, .98), rgba(10, 29, 44, .98));
    }
    .tile.col-group-10::before {
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, .92), transparent);
      opacity: .9;
    }
    .tile.col-group-10:hover {
      border-color: rgba(34, 211, 238, .92);
    }
    .tile.col-group-10 .tile-meta {
      color: #67e8f9;
    }

    .tile.featured {
      padding: 7px 11px;
      border: 1.5px solid rgba(245, 158, 11, 0.7);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(38, 35, 32, .96), rgba(16, 25, 40, .99));
      box-shadow: 0 4px 16px rgba(0, 0, 0, .28), 0 0 12px rgba(245, 158, 11, .14);
    }
    .tile.featured::before {
      height: 2.5px;
      opacity: 1;
      background: linear-gradient(90deg, transparent, #fbbf24, transparent);
    }
    .tile.featured:hover {
      border-color: #fbbf24;
      box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 16px rgba(245, 158, 11, .28);
    }

    .tile-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; min-width: 0;
      color: #9eb5ce;
      font-size: clamp(9.5px, 0.72vw, 11px);
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.1;
    }
    .tile.featured .tile-meta {
      font-size: clamp(11px, 0.85vw, 13px);
      color: #fde68a;
    }
    .tile-meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile-meta .b-label { text-align: right; }

    .tile-value {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fffbeb;
      font-size: clamp(14px, 1.35vw, 21px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: .2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile:not(.featured) .tile-value {
      font-size: clamp(11px, 0.95vw, 15px);
      color: #dbeaff;
    }

    #page2 { flex: 1; display: flex; }
    .page-placeholder {
      flex: 1;
      display: grid; place-items: center; padding: 30px;
      color: var(--muted); text-align: center;
      border: 1px dashed rgba(148,171,202,.25);
      border-radius: 14px; background: rgba(16,27,43,.55);
    }
    .page-placeholder strong { color: var(--text); font-size: 18px; }

    @media (max-width: 1100px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: 0 14px 24px;
      }
      #page1 { display: block; }
      .featured-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 10px;
      }
      .dashboard-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: auto;
      }
      .tile { min-height: 76px; padding: 8px 10px; }
      .tile.featured { min-height: 94px; }
    }

    @media (max-width: 650px) {
      body { padding: 0 10px 24px; }
      .topbar {
        height: auto;
        flex: none;
        padding: 10px 0;
        flex-wrap: wrap;
        gap: 8px;
      }
      .brand-mark { width: 32px; height: 32px; flex-basis: 32px; }
      .brand { font-size: 16px; }
      .brand-subtitle { font-size: 9px; }
      .header-actions { width: 100%; justify-content: space-between; }
      .home-btn { height: 32px; padding: 0 10px; font-size: 11px; }
      .page-tabs { flex: 1; }
      .tab { flex: 1; min-width: 0; height: 26px; font-size: 11px; }
      .featured-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .dashboard-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
      .tile { min-height: 72px; padding: 7px 8px; }
      .tile.featured { min-height: 86px; }
      .tile-meta { font-size: 10px; }
      .tile-value { font-size: 15px; }
      .tile:not(.featured) .tile-value { font-size: 13px; }
    }

    @media (max-width: 370px) {
      .featured-grid, .dashboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

      const OTHER_ROWS = 10;
      const OTHER_COLUMNS = 10;
      const TOTAL = FIRST_ROW_COUNT + (OTHER_ROWS * OTHER_COLUMNS); // 106 กล่อง

      const config = {};
      for (let i = 0; i < TOTAL; i++) {
        let colNum = i + 2; // 2 = B
        let colLetters = "";
        while (colNum > 0) {
          const rem = (colNum - 1) % 26;
          colLetters = String.fromCharCode(65 + rem) + colLetters;
          colNum = Math.floor((colNum - 1) / 26);

        config[`BOX${i + 1}`] = [`A${i + 1}`, `B${i + 1}`, `${colLetters}7`];
      }
      return config;

    BOX_CONFIG.BOX94 = ["Power L2", "W", "DB7"];
    BOX_CONFIG.BOX95 = ["Power L3", "W", "DC7"];
    BOX_CONFIG.BOX96 = ["kWh", "unit", "DE7"];
    // Power Meter 10
    BOX_CONFIG.BOX97 = ["Volt L1", "V", "DF7"];
    BOX_CONFIG.BOX98 = ["Volt L2", "V", "DG7"];
    BOX_CONFIG.BOX99 = ["Volt L3", "V", "DH7"];
    BOX_CONFIG.BOX100 = ["Current L1", "A", "DI7"];
    BOX_CONFIG.BOX101 = ["Current L2", "A", "DJ7"];
    BOX_CONFIG.BOX102 = ["Current L3", "A", "DK7"];
    BOX_CONFIG.BOX103 = ["Power L1", "W", "DM7"];
    BOX_CONFIG.BOX104 = ["Power L2", "W", "DN7"];
    BOX_CONFIG.BOX105 = ["Power L3", "W", "DO7"];
    BOX_CONFIG.BOX106 = ["kWh", "unit", "DQ7"];

    const boxEntries = Object.entries(BOX_CONFIG);
    const TOTAL_TILES = boxEntries.length; // 106 กล่องข้อมูล
    const FIRST_ROW_COUNT = 6;
    const OTHER_ROWS = 10;
    const OTHER_COLUMNS = 10;

    const featuredGrid = document.getElementById("featuredGrid");
    const grid = document.getElementById("dashboardGrid");
    const valueElements = [];

    function formatCellValue(cellValue) {
      if (cellValue === null || cellValue === undefined) return "—";
      const text = String(cellValue).trim();
      return text === "" ? "—" : text;
    }

    function getOtherRowColorClass(colInRow) {
      // colInRow คือลำดับกล่องข้อมูล (1 ถึง 10) ในแต่ละแถวที่ 2-11
      if (colInRow >= 4 && colInRow <= 6) return " col-group-456";
      if (colInRow >= 7 && colInRow <= 9) return " col-group-789";
      if (colInRow === 10) return " col-group-10";
      return "";
    }

    function createMeterLabelTile(meterNumber) {
      const tile = document.createElement("article");
      tile.className = "tile meter-label";

      const label = document.createElement("div");
      label.className = "meter-label-text";
      label.textContent = `Power Meter ${meterNumber}`;

      tile.append(label);
      return tile;
    }

    function createDataTile(boxIndex) {
      const [, cfg] = boxEntries[boxIndex];
      const labelA = cfg[0] ?? "";
      const labelB = cfg[1] ?? "";

      const isFeatured = boxIndex < FIRST_ROW_COUNT;
      const colInRow = ((boxIndex - FIRST_ROW_COUNT) % OTHER_COLUMNS) + 1;
      const extraClass = isFeatured
        ? " featured"
        : getOtherRowColorClass(colInRow);

      const tile = document.createElement("article");
      tile.className = "tile" + extraClass;

      const meta = document.createElement("div");
      meta.className = "tile-meta";

      const a = document.createElement("span");
      a.className = "a-label";
      a.textContent = labelA;

      const b = document.createElement("span");
      b.className = "b-label";
      b.textContent = labelB;

      const value = document.createElement("div");
      value.className = "tile-value";
      value.textContent = "—";

      meta.append(a, b);
      tile.append(meta, value);
      valueElements[boxIndex] = value;
      return tile;
    }

    function cellRefToCoords(ref) {
      const match = String(ref || "").trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
      if (!match) return null;
      const letters = match[1];
      const row = parseInt(match[2], 10);
      let col = 0;
      for (let i = 0; i < letters.length; i++) {
        col = col * 26 + (letters.charCodeAt(i) - 64);
      }
      return { row, col };
    }

    function coordsToCellRef(row, col) {
      let c = col;
      let letters = "";
      while (c > 0) {
        const rem = (c - 1) % 26;
        letters = String.fromCharCode(65 + rem) + letters;
        c = Math.floor((c - 1) / 26);
      }
      return `${letters}${row}`;
    }

    function getBoundingRange() {
      let minRow = Infinity, maxRow = -Infinity, minCol = Infinity, maxCol = -Infinity;
      for (const [, cfg] of boxEntries) {
        const coords = cellRefToCoords(cfg[2]);
        if (!coords) continue;
        if (coords.row < minRow) minRow = coords.row;
        if (coords.row > maxRow) maxRow = coords.row;
        if (coords.col < minCol) minCol = coords.col;
        if (coords.col > maxCol) maxCol = coords.col;
      }
      if (!isFinite(minRow)) return { range: "B7:EC7", minRow: 7, minCol: 2, cols: 106 };
      return {
        range: `${coordsToCellRef(minRow, minCol)}:${coordsToCellRef(maxRow, maxCol)}`,
        minRow,
        minCol,
        cols: maxCol - minCol + 1
      };
    }

    function initTiles() {
      featuredGrid.innerHTML = "";
      grid.innerHTML = "";
      valueElements.length = 0;

      // แถวที่ 1: กล่อง 1 - 6
      for (let i = 0; i < Math.min(FIRST_ROW_COUNT, TOTAL_TILES); i++) {
        featuredGrid.appendChild(createDataTile(i));
      }

      // แถวที่ 2 - 11: แทรก Power Meter1 - Power Meter10 ด้านซ้ายของแต่ละแถว
      let dataIdx = FIRST_ROW_COUNT;
      for (let r = 0; r < OTHER_ROWS; r++) {
        grid.appendChild(createMeterLabelTile(r + 1));

        for (let c = 0; c < OTHER_COLUMNS; c++) {
          if (dataIdx < TOTAL_TILES) {
            grid.appendChild(createDataTile(dataIdx));
            dataIdx++;
          }
        }
      }
    }

    function applyValuesByCellMap(cellMap) {
      for (let i = 0; i < TOTAL_TILES; i++) {
        const [, cfg] = boxEntries[i];
        const cellKey = String(cfg[2] || "").trim().toUpperCase();
        const rawVal = cellKey ? cellMap[cellKey] : "";
        const nextText = formatCellValue(rawVal);
        if (valueElements[i] && valueElements[i].textContent !== nextText) {
          valueElements[i].textContent = nextText;
        }
      }
    }

    function fetchViaJsonp(baseUrl, bounds) {
      return new Promise((resolve, reject) => {
        const cbName = "__hao2cSheetCb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const separator = baseUrl.includes("?") ? "&" : "?";
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Apps Script JSONP timeout"));
        }, 12000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Apps Script load error"));
        };

        const params = new URLSearchParams({
          sheet: SHEET_NAME,
          range: bounds.range,
          callback: cbName,
          _t: String(Date.now())
        });
        script.src = `${baseUrl}${separator}${params.toString()}`;
        document.body.appendChild(script);
      });
    }

    async function loadSheetData() {
      const bounds = getBoundingRange();
      const cellMap = {};

      try {
        const cleanWebApp = (WEB_APP_URL || "").trim();
        if (cleanWebApp && !cleanWebApp.includes("ใส่_")) {
          const data = await fetchViaJsonp(cleanWebApp, bounds);
          if (!data || !data.ok) throw new Error("Invalid Apps Script response");

          if (data.cells && typeof data.cells === "object") {
            for (const [k, v] of Object.entries(data.cells)) {
              cellMap[String(k).trim().toUpperCase()] = v;
            }
          } else if (Array.isArray(data.values)) {
            const rows = Array.isArray(data.values[0]) ? data.values : [data.values];
            rows.forEach((r, rIdx) => {
              r.forEach((val, cIdx) => {
                const ref = coordsToCellRef(bounds.minRow + rIdx, bounds.minCol + cIdx);
                cellMap[ref] = val;
              });
            });
          }
          applyValuesByCellMap(cellMap);
          return;
        }

        const cleanSheetId = (SPREADSHEET_ID || "").trim();
        if (!cleanSheetId || cleanSheetId.includes("ใส่_SPREADSHEET_ID_ที่นี่")) {
          return;
        }

        const encodedRange = encodeURIComponent(`${SHEET_NAME}!${bounds.range}`);
        const url = `https://docs.google.com/spreadsheets/d/${cleanSheetId}/gviz/tq?range=${encodedRange}&tqx=out:json&_t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("Google Sheets response error");

        const raw = await response.text();
        const start = raw.indexOf("{");
        const end = raw.lastIndexOf("}");
        if (start === -1 || end === -1) throw new Error("Invalid gviz JSON");

        const result = JSON.parse(raw.substring(start, end + 1));
        const tableRows = (result.table && result.table.rows) || [];
        tableRows.forEach((rowObj, rIdx) => {
          const cells = (rowObj && rowObj.c) || [];
          cells.forEach((cell, cIdx) => {
            const ref = coordsToCellRef(bounds.minRow + rIdx, bounds.minCol + cIdx);
            cellMap[ref] = (cell && cell.v !== null && cell.v !== undefined) ? (cell.f ?? cell.v) : "";
          });
        });

        applyValuesByCellMap(cellMap);
      } catch (error) {
        console.error("โหลดข้อมูล Google Sheets ไม่สำเร็จ:", error);
      }
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        const selectedPage = button.dataset.page;
        document.querySelectorAll(".tab").forEach(tab =>
          tab.classList.toggle("active", tab === button)
        );
        document.getElementById("page1").hidden = selectedPage !== "page1";
        document.getElementById("page2").hidden = selectedPage !== "page2";
      });
    });

    initTiles();
    loadSheetData();
    setInterval(loadSheetData, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
